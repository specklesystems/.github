name: callers-test

# Callers run these workflows from main (atlas change-gate rollout ADR-0004), so
# a file that GitHub cannot start stops every caller at once; for the risk check,
# with no status written. Each job calls this pull request's version with the
# inputs, secrets and permissions that callers pass. GitHub checks those when it
# loads the run, also for a job that never runs, so a wrong input, a missing
# permission or an invalid file fails this run instead.
on:
  pull_request:
    paths:
      - ".github/workflows/risk-check.yml"
      - ".github/workflows/risk-check-review.yml"
      - ".github/workflows/image-scan.yml"
      - ".github/workflows/callers-test.yml"

permissions: {}

jobs:
  risk-check:
    if: false
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/risk-check.yml
    with:
      runner: ubuntu-latest

  risk-check-review:
    if: false
    uses: ./.github/workflows/risk-check-review.yml
    with:
      runner: ubuntu-latest

  image-scan:
    if: false
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/image-scan.yml
    with:
      IMAGE_VERSION_TAG: callers-test
      IMAGE_REGISTRY_DOMAIN: ghcr.io
      IMAGE_REGISTRY_USERNAME: ${{ github.actor }}
      IMAGE_PREFIX: ghcr.io/specklesystems
      IMAGES: callers-test
      runner: ubuntu-latest
      timeout-minutes: 10
    secrets:
      IMAGE_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
