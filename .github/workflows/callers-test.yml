name: callers-test

# Callers run the risk check workflows from main (atlas change-gate rollout
# ADR-0004), so a file that GitHub cannot start stops every caller at once, with
# no status written. Each job calls this pull request's version with the inputs
# and permissions that callers pass. GitHub checks those when it loads the run,
# also for a job that never runs, so a wrong input, a missing permission or an
# invalid file fails this run instead.
on:
  pull_request:
    paths:
      - ".github/workflows/risk-check.yml"
      - ".github/workflows/risk-check-review.yml"
      - ".github/workflows/callers-test.yml"

permissions: {}

jobs:
  risk-check:
    if: false
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/risk-check.yml
    with:
      runner: ubuntu-latest

  risk-check-review:
    if: false
    uses: ./.github/workflows/risk-check-review.yml
    with:
      runner: ubuntu-latest
