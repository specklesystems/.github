name: secret-scan (reusable)

# A repo calls this from a job named `secret-scan`, pinned at a commit, with
# `permissions: contents: read`. Branch rules require the status by its name,
# `secret-scan / scan`, so the two job names are a contract: renaming either
# one blocks merges wherever the status is required.

on:
  workflow_call:

permissions: {}

jobs:
  scan:
    name: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      # Installed before the checkout and outside the workspace: on a pull
      # request the checked-out files are untrusted, and nothing from them runs.
      - name: Install Betterleaks
        env:
          BETTERLEAKS_VERSION: 1.10.0
          BETTERLEAKS_SHA256: 9d9ad503cd5d80d18a939352266c3fcca52f10da9b83cd5cfe646989b13940fe
        run: |
          archive="${RUNNER_TEMP}/betterleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "${archive}" \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${BETTERLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir "${RUNNER_TEMP}/betterleaks"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/betterleaks" betterleaks

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan the tracked files
        run: |
          # A copy of the index, so the scan reads every tracked file and not .git.
          checkout="${PWD}"
          tracked_files="$(mktemp -d)"
          git checkout-index --all --prefix="${tracked_files}/"
          cd "${tracked_files}"

          # A finding is excepted only by a rule with a reason in .betterleaks.toml.
          # The other ways hide one without a reason: an inline allow comment sits on
          # the leaking line itself, and Betterleaks 1.10.0 has no flag that stops it
          # reading these two ignore files at the root of the scanned directory.
          for ignore_file in .betterleaksignore .gitleaksignore; do
            if [[ -e "${ignore_file}" ]]; then
              echo "::error file=${ignore_file}::${ignore_file} is not accepted: add a rule with the reason to .betterleaks.toml instead."
              exit 1
            fi
          done

          # The config is loaded from the checkout, not from the copy: Betterleaks
          # skips the file it loaded as config, so a secret in the copy's
          # .betterleaks.toml would pass unread if that same file were the config.
          config=()
          if [[ -f "${checkout}/.betterleaks.toml" ]]; then
            config=(--config "${checkout}/.betterleaks.toml")
          fi

          if ! "${RUNNER_TEMP}/betterleaks/betterleaks" dir . "${config[@]}" \
            --ignore-gitleaks-allow --redact --no-banner --verbose; then
            echo "::error::Betterleaks found a secret. A real one: rotate it first, then remove it. Not a secret: add a rule with the reason to .betterleaks.toml."
            exit 1
          fi
