name: secret-scan-test

on:
  pull_request:
    paths:
      - .github/workflows/secret-scan.yml
      - .github/workflows/secret-scan-test.yml
      - tests/secret-scan.test.sh

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tests/secret-scan.test.sh
